<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yearly Overview — Roz Jewellers</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#141110;
      --panel-line:#3a3128;
      --gold:#cda653;
      --gold-soft:#e8d5a3;
      --cream:#f3ecdd;
      --cream-dim:#a99f8d;
    }

    *{ box-sizing:border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background:
        radial-gradient(circle at 50% -10%, #2a221b 0%, var(--ink) 55%),
        var(--ink);
      color: var(--cream);
      padding: 40px 20px 80px;
      margin: 0;
      text-align: center;
    }

    .topbar{
      max-width:820px;
      margin:0 auto 10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .back-link{
      font-size:0.82rem;
      letter-spacing:0.04em;
      color:var(--cream-dim);
      text-decoration:none;
      border:1px solid var(--panel-line);
      padding:8px 16px;
      border-radius:999px;
      transition:border-color .3s ease, color .3s ease;
    }
    .back-link:hover{ border-color:var(--gold); color:var(--gold-soft); }

    .year-badge{
      font-size:0.78rem;
      letter-spacing:0.08em;
      color:var(--gold-soft);
      border:1px solid var(--panel-line);
      padding:8px 16px;
      border-radius:999px;
    }

    .page-title{
      max-width:820px;
      margin:0 auto 30px;
    }

    .page-title h1{
      font-family:'Cormorant Garamond', serif;
      font-weight:600;
      font-size:clamp(1.8rem, 4vw, 2.4rem);
      color:var(--gold-soft);
      margin:0 0 6px;
    }

    .page-title p{
      margin:0;
      font-size:0.8rem;
      letter-spacing:0.14em;
      color:var(--cream-dim);
    }

    .empty-note{
      max-width:820px;
      margin:0 auto 34px;
      font-size:0.85rem;
      color:var(--cream-dim);
      border:1px dashed var(--panel-line);
      border-radius:14px;
      padding:14px 18px;
      display:none;
    }

    h2 {
      font-family:'Cormorant Garamond', serif;
      font-weight:600;
      font-size: 1.4rem;
      letter-spacing:0.03em;
      color: var(--gold-soft);
      margin: 56px 0 18px;
    }

    .chart-container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto 10px;
      background: linear-gradient(160deg, #201a15, #171310);
      border: 1px solid var(--panel-line);
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 14px 30px -18px rgba(0, 0, 0, 0.75);
    }

    canvas {
      max-width: 100%;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back-link" href="index.html">&larr; Dashboard</a>
    <span class="year-badge" id="yearBadge">2026</span>
  </div>

  <div class="page-title">
    <h1>Yearly Overview</h1>
    <p id="yearRange">Jan &mdash; Dec 2026</p>
  </div>

  <div class="empty-note" id="emptyNote">No entries recorded for this year yet — figures will fill in as you add them.</div>

  <h2>Jewellery profit</h2>
  <div class="chart-container">
    <canvas id="jewelleryChart"></canvas>
  </div>

  <h2>Expenses</h2>
  <div class="chart-container">
    <canvas id="expansesChart"></canvas>
  </div>

  <script>
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const zeros = new Array(12).fill(0);

    // Add a year's real figures here as they come in — any year left
    // out of this object automatically shows a clean, all-zero chart.
    const dataByYear = {
      "2026": {
            "j": [
                  0,
                  0,
                  0,
                  0,
                  0,
                  0,
                  0,
                  68296.48,
                  0,
                  0,
                  0,
                  0
            ],
            "e": [
                  0,
                  0,
                  0,
                  0,
                  0,
                  0,
                  0,
                  68851,
                  0,
                  0,
                  0,
                  0
            ]
      }
};

    function getYear() {
      const params = new URLSearchParams(window.location.search);
      return params.get('year') || localStorage.getItem('rozSelectedYear') || '2026';
    }

    const year = getYear();
    localStorage.setItem('rozSelectedYear', year);
    document.getElementById('yearBadge').textContent = year;
    document.getElementById('yearRange').textContent = `Jan — Dec ${year}`;

    const yearData = dataByYear[year];
    if (!yearData) {
      document.getElementById('emptyNote').style.display = 'block';
    }
    const j = yearData ? yearData.j : zeros;
    const e = yearData ? yearData.e : zeros;

    const gridColor = 'rgba(243, 236, 221, 0.08)';
    const tickColor = '#a99f8d';

    const baseOptions = {
      responsive: true,
      plugins: {
        legend: {
          labels: { color: '#f3ecdd', font: { family: "'Poppins', sans-serif" } }
        },
        title: {
          display: false
        }
      },
      scales: {
        x: {
          ticks: { color: tickColor, font: { family: "'Poppins', sans-serif" } },
          grid: { color: gridColor }
        },
        y: {
          beginAtZero: true,
          ticks: { color: tickColor, font: { family: "'Poppins', sans-serif" } },
          grid: { color: gridColor }
        }
      }
    };

    function getGradient(ctx, color1, color2) {
      const gradient = ctx.createLinearGradient(0, 0, 0, 400);
      gradient.addColorStop(0, color1);
      gradient.addColorStop(1, color2);
      return gradient;
    }

    function createBarChart(id, label, data, color1, color2) {
      const ctx = document.getElementById(id).getContext('2d');
      const gradient = getGradient(ctx, color1, color2);
      let delayed;

      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: months,
          datasets: [{
            label: label,
            data: data,
            backgroundColor: gradient,
            borderRadius: 8
          }]
        },
        options: {
          ...baseOptions,
          animation: {
            onComplete: () => { delayed = true; },
            delay: (context) => {
              let delay = 0;
              if (context.type === 'data' && context.mode === 'default' && !delayed) {
                delay = context.dataIndex * 200;
              }
              return delay;
            },
            duration: 1000,
            easing: 'easeOutQuart'
          }
        }
      });
    }

    createBarChart('jewelleryChart', 'Jewellery Profit', j, '#e2c47f', '#cda653');  // Gold
    createBarChart('expansesChart', 'Expenses', e, '#c46577', '#a13d4c');           // Ruby
  </script>

</body>
</html>
